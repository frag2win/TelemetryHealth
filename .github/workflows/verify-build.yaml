name: TelemetryHealth Master Build & Verification Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-modules:
    name: Build & Test Enforcer
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup Go Runtime Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify Custom OTel Processor Module
        run: |
          cd processor
          go mod download
          go vet ./...
          go build -v ./...
          go test -v ./...

      - name: Verify Control Plane Module
        run: |
          cd control-plane
          go mod download
          go vet ./...
          go build -v ./cmd/api-server
          go build -v ./cmd/mcp-server
          go test -v ./...
