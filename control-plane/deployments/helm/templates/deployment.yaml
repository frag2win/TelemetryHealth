apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-controlplane
  labels:
    app: telemetryhealth-controlplane
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: telemetryhealth-controlplane
  template:
    metadata:
      labels:
        app: telemetryhealth-controlplane
    spec:
      containers:
        - name: controlplane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
