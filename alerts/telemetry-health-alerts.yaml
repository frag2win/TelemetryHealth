alerts:
  - name: "High Cardinality Detected"
    condition: "cardinality_max > 100000"
    severity: "critical"
    description: "Attribute cardinality estimate exceeded 100k unique values within window"
    labels:
      team: "platform-observability"
      category: "cardinality"
  - name: "Orphan Rate > 5%"
    condition: "orphan_rate > 0.05"
    severity: "warning"
    description: "More than 5% of incoming trace spans are orphaned without parent span"
    labels:
      team: "platform-observability"
      category: "trace-chain"
  - name: "Coverage Gap (silent 15m)"
    condition: "service_silent_minutes > 15"
    severity: "warning"
    description: "Expected service has emitted zero telemetry spans or metrics in last 15 minutes"
    labels:
      team: "platform-observability"
      category: "coverage"
  - name: "AI Agent Health Score Critical"
    condition: "telemetryhealth_agent_health_score < 0.8"
    severity: "critical"
    description: "AI Agent composite health score has dropped below 0.8 (80%)"
    labels:
      team: "ai-operations"
      category: "agent-health"
  - name: "AI Agent Token Burn Rate Spike"
    condition: "rate(telemetryhealth_agent_token_burn_rate[5m]) > 10000"
    severity: "warning"
    description: "AI Agent token consumption rate has spiked above 10,000 tokens/sec in the last 5 minutes"
    labels:
      team: "ai-operations"
      category: "billing-cost"

